name: Build & Deploy Engine
on: [push, pull_request]
jobs:
#  cleanup:
#    runs-on: self-hosted
#    steps:
#    - name: Cleanup
#      run: rm -rf .* || true
  build:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # CS 1.6 в браузере: матрица урезана до Windows и Android — это всё, что показано на
          # странице «Скачать игру» на сайте. Остальные платформы апстрима (Linux, Switch, PS4,
          # Vita, Sailfish, macOS/iOS, Flatpak) выключены, чтобы сборка укладывалась в бесплатный
          # лимит минут GitHub Actions и не падала там, где мы не сможем починить (нет этих
          # платформ под рукой, чтобы проверить). Включить обратно — вернуть строки из истории git.
          - os: ubuntu-latest
            targetos: android
            targetarch: multiarch
          - os: windows-latest
            targetos: win32
            targetarch: amd64
          - os: windows-2022 # всегда самая старая для 32-бит — компилятор новее её хуже дружит со старыми Windows
            targetos: win32
            targetarch: i386
    env:
      SDL_VERSION: 2.32.10
      FFMPEG_VERSION: '9.0'
      YY_THUNKS_VERSION: v1.2.1
      SAILFISH_SDK_VERSION: 3.13.5
      SAILFISH_TARGET_VERSION: 5.1.0.11
      GH_CPU_ARCH: ${{ matrix.targetarch }}
      GH_CPU_OS: ${{ matrix.targetos }}
      GH_CROSSCOMPILING: ${{ matrix.cross }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Cache Sailfish SDK images
      if: matrix.targetos == 'sailfish'
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/sailfish-sdk
        key: sailfish-sdk-${{ env.SAILFISH_SDK_VERSION }}-${{ env.SAILFISH_TARGET_VERSION }}-${{ matrix.targetarch }}
    - name: Install dependencies
      run: bash scripts/gha/deps_${{ matrix.targetos }}.sh
    - name: Build engine
      env:
        FWGS_PFX_PASSWORD: ${{ secrets.FWGS_PFX_PASSWORD }}
      run: bash scripts/gha/build_${{ matrix.targetos }}.sh
    - name: Upload engine (artifacts)
      uses: actions/upload-artifact@v7
      with:
        name: artifact-${{ matrix.targetos }}-${{ matrix.targetarch }}
        path: artifacts/*
    - name: Validate package for Harbour
      if: matrix.targetos == 'sailfish'
      run: bash scripts/gha/validate_sailfish.sh
  # CS 1.6 в браузере: джоба flatpak апстрима убрана — она собирала Linux-платформу, которую мы не раздаём.
  release:
    name: "Upload releases"
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ github.event_name == 'push' }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Remove old release, fetch artifacts, repackage binaries and upload new release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BASE_BUILDNUM_DATE: "2015-04-01"
      run: bash scripts/gha/make_release.sh "CS 1.6 в браузере" "${{ github.ref_name }}"
